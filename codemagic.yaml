workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 120
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK Release
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - ayoubboutglay318@gmail.com

  ios-debug-simulator:
    name: iOS Debug Simulator (No Certificates Required)
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS app for Simulator (debug mode - NO SIGNING)
        script: flutter build ios --simulator
    artifacts:
      - build/ios/iphonesimulator/*.app
    publishing:
      email:
        recipients:
          - ayoubboutglay318@gmail.com

  ios-app-store:
    name: iOS App Store Release
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS app for App Store
        script: flutter build ios --release
      - name: Create IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r Goalivo.ipa Payload/
          mv Goalivo.ipa ../../../
    artifacts:
      - Goalivo.ipa
    publishing:
      email:
        recipients:
          - ayoubboutglay318@gmail.com

