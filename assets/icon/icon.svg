<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16a34a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" fill="white"/>

  <!-- Icon: target rings -->
  <g transform="translate(96, 96)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="70" fill="url(#greenGrad)"/>
    <circle cx="0" cy="0" r="52" fill="white"/>
    <circle cx="0" cy="0" r="34" fill="url(#accentGrad)"/>
    <circle cx="0" cy="0" r="16" fill="white"/>
    <!-- Arrow pointing up-right through the rings -->
    <line x1="-28" y1="28" x2="14" y2="-14" stroke="white" stroke-width="9" stroke-linecap="round"/>
    <polygon points="14,-28  28,-14  2,-2" fill="white"/>
  </g>
</svg>